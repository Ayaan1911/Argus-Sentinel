name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest-cov ruff
      - name: Verify Docker for PostgreSQL tests
        run: docker info
      - name: Validate intelligence library
        run: python scripts/validate_intelligence.py
      - name: Check for Python errors
        run: ruff check backend/app backend/tests scripts --select E9,F63,F7,F82
      - name: Test backend with coverage
        working-directory: backend
        run: pytest -q -ra --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Publish coverage summary
        if: always()
        working-directory: backend
        run: |
          if [ -f coverage.xml ]; then
            echo '## Backend coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
