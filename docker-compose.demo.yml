# Public demo overlay. Requires Compose 2.24.4+ for !override.
# docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build -d
services:
  db:
    networks: [private]

  redis:
    networks: [private]

  juice-shop:
    ports: !override []
    networks: [private]

  worker:
    # Only the internal network has no external gateway. This worker can
    # reach Juice Shop, Redis, and Postgres, but no public or metadata IP.
    networks: [private]
    volumes: !override
      - ./argus-intelligence:/argus-intelligence:ro
      - nuclei_templates:/root/nuclei-templates
    environment:
      DEMO_MODE: "true"
      ENVIRONMENT: production

  api:
    ports: !override []
    networks: [private, web]
    volumes: !override
      - ./argus-intelligence:/argus-intelligence:ro
      - nuclei_templates:/root/nuclei-templates
    environment:
      DEMO_MODE: "true"
      DEMO_API_KEY: ${DEMO_API_KEY:-argus-public-demo-2026}
      DEMO_SCAN_DAILY_LIMIT: ${DEMO_SCAN_DAILY_LIMIT:-500}
      ENVIRONMENT: production
    # Trust forwarded addresses from Caddy only, even though other services
    # on the private network can also reach the API.
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips 172.31.245.254"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
      args:
        VITE_API_URL: /api/v1
        VITE_DEMO_MODE: "true"
        VITE_API_KEY: ${DEMO_API_KEY:-argus-public-demo-2026}
    ports: !override []
    volumes: !override []
    env_file: !reset []
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN to the public demo hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web:
        ipv4_address: 172.31.245.254
    depends_on: [api, frontend]

networks:
  private:
    internal: true
  web:
    ipam:
      config:
        - subnet: 172.31.245.0/24

volumes:
  caddy_data:
  caddy_config:
